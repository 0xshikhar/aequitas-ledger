apiVersion: apps/v1
kind: Deployment
metadata:
  name: aequitas-follower
  namespace: default
  labels:
    app: aequitas-ledger
    role: follower
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aequitas-ledger
      role: follower
  template:
    metadata:
      labels:
        app: aequitas-ledger
        role: follower
    spec:
      containers:
        - name: ledger-follower
          image: aequitas-ledger:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aequitas-config
          env:
            - name: LEDGER_ROLE
              value: "FOLLOWER"
            - name: PRIMARY_ADDR
              value: "aequitas-primary-headless:50051"
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: rest
            - containerPort: 6060
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
