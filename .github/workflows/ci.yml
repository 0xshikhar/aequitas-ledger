name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, fmt, race, gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt (no diffs allowed)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: Panic grep gate
        run: |
          # C0.7 policy: no panic() anywhere in internal/ — invariant
          # violations surface as typed errors + the invariant_violations
          # metric instead.
          hits=$(grep -RnE '\bpanic\(' internal --include='*.go' || true)
          if [ -n "$hits" ]; then
            echo "panic() found:"
            echo "$hits"
            exit 1
          fi

      - name: Test (race)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout 5m

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Short budgets: CI fuzzing is a smoke test for decoder panics on fresh
      # inputs; deep campaigns run locally with -fuzztime in the minutes.
      - name: Fuzz decoders (10s each)
        run: |
          go test -run '^$' -fuzz FuzzDecodeRecord -fuzztime 10s ./tests/unit
          go test -run '^$' -fuzz FuzzUint128StringRoundTrip -fuzztime 10s ./tests/unit

  bench-smoke:
    name: bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke floors
        run: ./scripts/bench_smoke.sh
