syntax = "proto3";

package ledger.v1;

option go_package = "aequitas-ledger/proto/ledger/v1;ledgerv1";

// Money represents 128-bit unsigned integer money amount using two uint64 fields.
message Money {
  uint64 lo = 1;
  uint64 hi = 2;
}

message Account {
  bytes id = 1;
  string currency = 2;
  Money posted_debits = 3;
  Money posted_credits = 4;
  Money pending_debits = 5;
  Money pending_credits = 6;
  Money balance = 7;
  Money available_balance = 8;
}

message Transfer {
  bytes id = 1;
  bytes debit_account_id = 2;
  bytes credit_account_id = 3;
  Money amount = 4;
  bytes idempotency_key = 5;
  int64 created_at = 6;
  uint32 flags = 7;
  uint64 timeout = 8;
}

message CreateAccountRequest {
  bytes id = 1;
  string currency = 2;
  Money initial_posted_credits = 3;
}

message CreateAccountResponse {
  Account account = 1;
}

message GetAccountRequest {
  bytes id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message CreateTransferRequest {
  bytes id = 1;
  bytes debit_account_id = 2;
  bytes credit_account_id = 3;
  Money amount = 4;
  bytes idempotency_key = 5;
  uint32 flags = 6;
  uint64 timeout = 7;
}

message CreateTransferResponse {
  Transfer transfer = 1;
}

// Batched API (D1.1): one RPC submits up to 8192 items and returns one
// positional result per item, mirroring TigerBeetle's batch protocol.
message TransferResult {
  bool ok = 1;
  // transfer is set when ok is true: the committed transfer.
  Transfer transfer = 2;
  // error is set when ok is false: a human-readable per-item failure reason
  // (e.g. insufficient funds, unknown account).
  string error = 3;
}

message CreateTransfersRequest {
  repeated Transfer transfers = 1;
}

message CreateTransfersResponse {
  repeated TransferResult results = 1;
}

message AccountResult {
  bool ok = 1;
  // account is set when ok is true: the created account.
  Account account = 2;
  // error is set when ok is false.
  string error = 3;
}

message CreateAccountsRequest {
  repeated CreateAccountRequest accounts = 1;
}

message CreateAccountsResponse {
  repeated AccountResult results = 1;
}

// Query API (D1.5): point-lookup for transfers and paginated transfer history
message GetTransferRequest {
  bytes id = 1;
}

message GetTransferResponse {
  Transfer transfer = 1;
}

message GetAccountTransfersRequest {
  bytes account_id = 1;
  bytes after_id = 2;
  uint32 limit = 3;
}

message GetAccountTransfersResponse {
  repeated Transfer transfers = 1;
}

service LedgerService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc CreateAccounts(CreateAccountsRequest) returns (CreateAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
  rpc CreateTransfers(CreateTransfersRequest) returns (CreateTransfersResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
  rpc GetAccountTransfers(GetAccountTransfersRequest) returns (GetAccountTransfersResponse);
}
