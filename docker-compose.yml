version: '3.8'

services:
  aequitas-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
      - "6060:6060"
    environment:
      - PORT=50051
      - METRICS_PORT=6060
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - WAL_DIR=/var/lib/aequitas/wal
    volumes:
      - ledger-data:/var/lib/aequitas/wal

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aequitas_bench
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  ledger-data:
  postgres-data:
